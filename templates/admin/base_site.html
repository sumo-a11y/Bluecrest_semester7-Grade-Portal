{% extends "admin/base.html" %}
{% load i18n static %}

{% block title %}{% trans "Django administration" %}{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
    body {
        background: linear-gradient(rgba(240,248,255,0.80), rgba(240,248,255,0.80)),
                    url("{% static 'image2.jpeg' %}") no-repeat center center fixed;
        background-size: cover;
        color: #0d2c5b;
    }
    #header, .module caption, .app-list h2, .dashboard-module h2 {
        background: rgba(15, 79, 138, 0.95) !important;
    }
    #header h1, #user-tools a, .module caption, .app-list h2, .dashboard-module h2 {
        color: #fff !important;
    }
    #user-tools a[href$="/logout/"] {
        display: inline-block;
        padding-left: 30px;
        background: url("{% static 'image2.jpeg' %}") no-repeat left center;
        background-size: 20px 20px;
        color: #fff !important;
    }
    .module, .dashboard-module, .app-list {
        background: rgba(255,255,255,0.92);
    }
    #content-main {
        background: rgba(255,255,255,0.92);
    }
</style>
{% endblock %}
