<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bluecrest University Portal{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            background: linear-gradient(rgba(240,248,255,0.90), rgba(240,248,255,0.90)),
                        url("{% static 'image2.jpeg' %}") no-repeat center center fixed;
            background-size: cover;
            color: #0d2c5b;
        }
        nav {
            margin-bottom: 18px;
        }
        nav a {
            margin-right: 14px;
            color: #0f4f8a;
            text-decoration: none;
            font-weight: 600;
        }
        nav a:hover {
            text-decoration: underline;
        }
        hr {
            border: none;
            border-top: 1px solid rgba(15, 79, 138, 0.25);
            margin: 24px 0;
        }
        h1 {
            color: #0b3a72;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background: rgba(255,255,255,0.95);
        }
        th, td {
            border: 1px solid #aac4e5;
            padding: 8px;
        }
        th {
            background: #1f77d7;
            color: #fff;
        }
        td {
            color: #1c355d;
        }
        .errorlist {
            color: #b00020;
            margin: 0 0 10px;
        }
        .actions {
            margin-top: 16px;
        }
        /* Action link styles */
        .actions a, .actions button {
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid transparent;
            font-size: 0.95rem;
        }
        .actions a.action-view {
            color: #0c0909;
            background: rgba(8, 3, 3, 0.04);
            border-color: rgba(10, 3, 3, 0.08);
        }
        .actions a.action-edit {
            color: #0f4f8a;
            background: rgba(15,79,138,0.06);
            border-color: rgba(16, 17, 17, 0.12);
        }
        .actions a.action-delete,
        .actions button.confirm-delete {
            color: #a5a0a0;
            background: #eb0b0b; /* red delete */
            border-color: #b71c1c;
        }
        /* Style selects for department fields to be more prominent gray */
        select[name="department"], select[id$="department"] {
            background: #070303;
            color: #050303;
            border: 1px solid #0f0202;
            padding: 6px 8px;
            border-radius: 4px;
        }
        /* Related links next to selects (Add another / Change selected / Delete / View) */
        .related-widget-wrapper a,
        form a.addlink, form a.changelink, form a.deletelink, form a.viewlink,
        .actions a.action-view, .actions a.action-edit, .actions a.action-delete,
        a.addlink, a.changelink, a.deletelink, a.viewlink {
            display: inline-block;
            margin-left: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(0,0,0,0.06);
            text-decoration: none;
            transition: background-color .12s ease, color .12s ease, transform .06s ease;
            font-weight: 600;
        }
        .related-widget-wrapper a, a.addlink, a.changelink, a.viewlink {
            background: transparent;
            color: #0c0a0a; /* deep gray */
        }
        .related-widget-wrapper a:hover, a.addlink:hover, a.changelink:hover, a.viewlink:hover,
        .actions a.action-view:hover, .actions a.action-edit:hover {
            background: rgba(0,0,0,0.05);
            color: #111;
            transform: translateY(-1px);
        }
        .related-widget-wrapper a.deletelink, a.deletelink, .actions a.action-delete, button.confirm-delete {
            background: #c62828; /* red */
            color: #fff;
            border-color: #b71c1c;
        }
        .related-widget-wrapper a.deletelink:hover, a.deletelink:hover, .actions a.action-delete:hover, button.confirm-delete:hover {
            background: #b71c1c;
            box-shadow: 0 6px 12px rgba(183,28,28,0.18);
            transform: translateY(-1px);
        }
        /* Focus styles for accessibility */
        .related-widget-wrapper a:focus, a.addlink:focus, a.changelink:focus, a.deletelink:focus, a.viewlink:focus {
            outline: 3px solid rgba(21,101,192,0.18);
            outline-offset: 2px;
        }
        /* Form labels in form tables (e.g. Code:, Title:, Credits:, etc.) */
        form table.form-table th {
            color: #000; /* deep black for labels */
            font-weight: 700;
            background: transparent;
            border: none;
            padding-right: 12px;
        }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'students:student-list' %}">Students</a>
    <a href="{% url 'students:department-list' %}">Departments</a>
    <a href="{% url 'students:semester-list' %}">Semesters</a>
    <a href="{% url 'students:course-list' %}">Courses</a>
    <a href="{% url 'students:registration-list' %}">Registrations</a>
</nav>
<hr>
<h1>{% block heading %}Bluecrest University Portal{% endblock %}</h1>
{% block content %}{% endblock %}
</body>
</html>
